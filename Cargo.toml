[workspace]
resolver = "2"
members = [
  "crates/galdeck-cli",
  "crates/galdeck-ipc",
  "crates/galdeck-model",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/cynak/galdeck-cli"
homepage = "https://github.com/cynak/galdeck-cli"
authors = ["galdeck contributors"]

[workspace.dependencies]
# The hardware framework, published at https://crates.io/crates/galdeck.
# Pinned by Cargo.lock, which CI builds with --locked. For local work against
# an unpublished framework change, add to .cargo/config.toml (not committed):
#   [patch.crates-io]
#   galdeck = { path = "../galdeck" }
galdeck = "0.3.0"

# Both a version and a path, deliberately. The path is what a local build
# resolves; the version is what `cargo publish` substitutes, because cargo
# strips `path` from a published manifest and refuses to package a dependency
# that carries no version at all. Bumping one of these means bumping the other.
galdeck-ipc = { version = "0.1.0", path = "crates/galdeck-ipc" }
galdeck-model = { version = "0.1.0", path = "crates/galdeck-model" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
